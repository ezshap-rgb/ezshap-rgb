name: Update Deployed Pages List

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Repos with GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          echo "### 🌐 Live GitHub Pages Sites" > pages_list.md
          echo "Last updated: $(date -u +'%Y-%m-%d')" >> pages_list.md
          echo "" >> pages_list.md

          # Query GitHub API safely
          gh api "users/$USERNAME/repos?per_page=100" --paginate \
            --jq '.[] | select(.has_pages == true) | "* [" + .name + "](https://'${USERNAME}'.github.io/" + .name + ") - " + (.description // "No description")' \
            >> pages_list.md

      - name: Insert List into README
        run: |
          python3 -c '
          import os

          readme_path = "README.md"
          list_path = "pages_list.md"

          if not os.path.exists(readme_path):
              with open(readme_path, "w") as f:
                  f.write("# Profile\n\n<!-- PAGES-LIST:START -->\n<!-- PAGES-LIST:END -->\n")

          with open(readme_path, "r") as f:
              readme_content = f.read()

          with open(list_path, "r") as f:
              new_list = f.read().strip()

          start_marker = "<!-- PAGES-LIST:START -->"
          end_marker = "<!-- PAGES-LIST:END -->"

          if start_marker not in readme_content or end_marker not in readme_content:
              readme_content += f"\n\n{start_marker}\n{end_marker}\n"

          start_idx = readme_content.find(start_marker) + len(start_marker)
          end_idx = readme_content.find(end_marker)

          updated_readme = (
              readme_content[:start_idx]
              + "\n" + new_list + "\n"
              + readme_content[end_idx:]
          )

          with open(readme_path, "w") as f:
              f.write(updated_readme)
          '
          rm pages_list.md

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update deployed GitHub Pages list"
            git push
          else
            echo "No changes detected."
          fi
