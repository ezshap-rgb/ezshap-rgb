name: Update Deployed Pages List

on:
  schedule:
    # Runs automatically every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to run it manually anytime from the Actions tab

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Repos with GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          echo "### 🌐 Live GitHub Pages Sites" > pages_list.md
          echo "Last updated: $(date -u +'%Y-%m-%d')" >> pages_list.md
          echo "" >> pages_list.md

          # Query GitHub API for all public repos owned by the user
          gh api "users/$USERNAME/repos?per_page=100" --paginate \
            --jq '.[] | select(.has_pages == true) | "* [" + .name + "](https://'${USERNAME}'.github.io/" + .name + ") - " + (.description // "No description")' \
            >> pages_list.md

      - name: Insert List into README
        run: |
          # Create markers if they don't exist in README.md
          if ! grep -q "<!-- PAGES-LIST:START -->" README.md; then
            echo -e "\n<!-- PAGES-LIST:START -->\n<!-- PAGES-LIST:END -->" >> README.md
          fi

          # Replace content between markers with the generated list
          sed -i '/<!-- PAGES-LIST:START -->/,/<!-- PAGES-LIST:END -->/{
            /<!-- PAGES-LIST:START -->/!{/<!-- PAGES-LIST:END -->/!d}
            /<!-- PAGES-LIST:START -->/r pages_list.md
          }' README.md

          rm pages_list.md

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update deployed GitHub Pages list"
            git push
          else
            echo "No changes detected."
          fi
